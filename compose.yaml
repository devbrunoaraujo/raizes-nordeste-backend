name: raizes-nordeste

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: raizes_nordeste
      MYSQL_USER: raizes_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: